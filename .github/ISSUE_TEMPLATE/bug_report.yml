name: Bug report
description: Something in nāda doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `nada --version`, `yt-dlp --version`, `mpd --version | head -1`, your desktop and distribution.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Daemon log
      description: Anything relevant from `~/.local/state/nada/daemon.log` (a Traceback especially).
      render: text
